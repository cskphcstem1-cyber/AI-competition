[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Keep API routes working; SPA fallback last.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Serve the React app for every path so reload /math/compare etc. does not 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
